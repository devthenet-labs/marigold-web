<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marigold</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<main class="card">
  <h1>Marigold</h1>
  <p id="greeting" class="greeting" aria-live="polite">Asking the API for a greeting...</p>
  <form id="name-form" class="name-form">
    <label for="name-input">Your name</label>
    <input id="name-input" name="name" type="text" maxlength="40"
           autocomplete="name" placeholder="Ada Lovelace">
    <button type="submit">Greet me</button>
  </form>
  <dl class="meta">
    <dt>API revision</dt>
    <dd><code id="api-revision">-</code></dd>
    <dt>Served at</dt>
    <dd><code id="served-at">-</code></dd>
  </dl>
</main>
</body>
</html>
